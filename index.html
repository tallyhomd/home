<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily SAT · Craft and Structure</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5b6776;
      --line: #d9e0ea;
      --paper: #f7f4ee;
      --card: #ffffff;
      --navy: #1e3a5f;
      --navy-2: #16304d;
      --accent: #c45c26;
      --good: #1f7a4d;
      --bad: #b42318;
      --lock: #e8edf3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
    }
    .sans { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
    header {
      background: var(--navy);
      color: #fff;
      padding: 1rem 1.25rem;
    }
    header h1 {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0 0 0.2rem;
      font-weight: 650;
    }
    header p { margin: 0; color: #d7e3f4; font-size: 0.92rem; }
    main { max-width: 760px; margin: 0 auto; padding: 1.25rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.15rem 1.2rem 1.3rem;
      box-shadow: 0 1px 2px rgba(28, 36, 48, 0.04);
    }
    .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    .pill {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      font-size: 0.78rem;
      background: var(--lock);
      color: var(--navy);
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-weight: 600;
    }
    .pill.skill { background: #efe4d8; color: #7a3e16; }
    button, select, .choice {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    button.primary, button.secondary {
      border: 0;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: var(--navy); color: #fff; }
    button.primary:hover { background: var(--navy-2); }
    button.secondary {
      background: #fff;
      color: var(--navy);
      border: 1px solid var(--line);
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .timer {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--navy);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    .timer.warn { color: var(--accent); }
    .timer.hot { color: var(--bad); }
    .passage {
      font-size: 1.08rem;
      margin: 0.85rem 0 0.6rem;
    }
    .passage .label {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .prompt { font-size: 1rem; color: #243044; margin: 0.75rem 0; }
    .choices { display: grid; gap: 0.5rem; }
    .choice {
      display: flex;
      gap: 0.7rem;
      text-align: left;
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      cursor: pointer;
      font-size: 0.98rem;
      color: inherit;
    }
    .choice:hover { border-color: #9aa8bb; }
    .choice.selected { border-color: var(--navy); box-shadow: 0 0 0 2px rgba(30, 58, 95, 0.18); }
    .choice.correct { border-color: var(--good); background: #eef8f2; }
    .choice.wrong { border-color: var(--bad); background: #fdeeee; }
    .letter {
      font-weight: 700;
      color: var(--navy);
      min-width: 1.1rem;
    }
    .dots { display: flex; gap: 0.35rem; margin: 0.8rem 0 1rem; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #cfd8e3;
    }
    .dot.on { background: var(--navy); }
    .dot.done { background: #88a0bd; }
    .explain {
      margin-top: 1rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--line);
      font-size: 0.97rem;
    }
    .explain h3 {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 0.4rem;
    }
    .muted { color: var(--muted); }
    .score { font-size: 2rem; font-weight: 700; color: var(--navy); margin: 0.2rem 0; }
    .nav { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    a { color: #d7e3f4; }
    footer {
      max-width: 760px;
      margin: 0 auto 2rem;
      padding: 0 1.25rem;
      color: var(--muted);
      font-size: 0.82rem;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.45rem 0.55rem;
      background: #fff;
    }
    .hidden { display: none; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
  </style>
</head>
<body>
  <header>
    <h1>Daily SAT · Craft and Structure</h1>
    <p>10 original questions · 12 minutes · Words in Context, Text Structure, Cross-Text</p>
  </header>
  <main>
    <section id="home" class="card"></section>
    <section id="quiz" class="card hidden"></section>
    <section id="results" class="card hidden"></section>
  </main>
  <footer>
    Original practice items for family SAT prep. Not affiliated with College Board.
    Future days stay locked in this page, but a public GitHub repo still exposes the JSON/JS files.
  </footer>

  <script src="questions-01-10.js"></script>
  <script src="questions-11-20.js"></script>
  <script src="questions-21-30.js"></script>
  <script src="questions-31-40.js"></script>
  <script src="questions-41-50.js"></script>
  <script src="questions-51-60.js"></script>
  <script>
    const START = { y: 2026, m: 9, d: 19 };
    const TOTAL = 60;
    const MINUTES = 12;
    const STORE = "sat-cs-60-v1";

    const home = document.getElementById("home");
    const quizEl = document.getElementById("quiz");
    const resultsEl = document.getElementById("results");

    function etYmd() {
      const s = new Date().toLocaleString("en-US", {
        timeZone: "America/New_York",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });
      const [m, d, y] = s.split("/").map((x) => parseInt(x, 10));
      return { y, m, d };
    }
    function ord(y, m, d) {
      return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
    }
    function calendarDayNumber() {
      const t = etYmd();
      return ord(t.y, t.m, t.d) - ord(START.y, START.m, START.d) + 1;
    }
    function ymdFromDay(n) {
      const utc = Date.UTC(START.y, START.m - 1, START.d + (n - 1));
      const dt = new Date(utc);
      const y = dt.getUTCFullYear();
      const m = String(dt.getUTCMonth() + 1).padStart(2, "0");
      const d = String(dt.getUTCDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    function pretty(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric",
        timeZone: "UTC"
      });
    }

    function bankDays() {
      const list = (window.SAT_DAYS || []).slice().sort((a, b) => a.day - b.day);
      const map = new Map();
      list.forEach((d) => map.set(d.day, d));
      return map;
    }
    function loadStore() {
      try { return JSON.parse(localStorage.getItem(STORE) || "{}"); }
      catch { return {}; }
    }
    function saveStore(data) {
      localStorage.setItem(STORE, JSON.stringify(data));
    }

    let state = {
      day: 1,
      idx: 0,
      answers: [],
      seconds: MINUTES * 60,
      tick: null,
      review: false
    };

    function show(id) {
      home.classList.toggle("hidden", id !== "home");
      quizEl.classList.toggle("hidden", id !== "quiz");
      resultsEl.classList.toggle("hidden", id !== "results");
    }

    function renderHome() {
      const days = bankDays();
      const cal = calendarDayNumber();
      const unlocked = Math.min(Math.max(cal, 0), TOTAL);
      const available = [...days.keys()].filter((n) => n <= unlocked || cal > TOTAL).sort((a, b) => a - b);
      const defaultDay = days.has(Math.min(Math.max(cal, 1), TOTAL))
        ? Math.min(Math.max(cal, 1), TOTAL)
        : (available[available.length - 1] || 1);
      const stored = loadStore();
      const options = available.map((n) => {
        const mark = stored[n] ? ` · ${stored[n].score}/10` : "";
        const today = n === cal ? " (today)" : "";
        return `<option value="${n}" ${n === defaultDay ? "selected" : ""}>Day ${n} · ${pretty(ymdFromDay(n))}${today}${mark}</option>`;
      }).join("");

      let status;
      if (!days.size) {
        status = `<p>No question files loaded. Upload <code>questions-01-10.js</code> through <code>questions-51-60.js</code> next to this page.</p>`;
      } else if (cal < 1) {
        status = `<p>Practice starts September 19, 2026 (Eastern). Preview uses Day 1 if present.</p>`;
      } else if (cal > TOTAL) {
        status = `<p>The 60-day sequence ended November 17, 2026. You can review any loaded day.</p>`;
      } else if (!days.has(cal)) {
        status = `<p>Today is Day ${cal}, but that file is not in this repo yet. Choose a loaded day below.</p>`;
      } else {
        status = `<p class="muted sans">Today is Day ${cal} · ${pretty(ymdFromDay(cal))}.</p>`;
      }

      home.innerHTML = `
        <div class="row sans">
          <span class="pill">60-day bank</span>
          <span class="pill">${days.size} day${days.size === 1 ? "" : "s"} loaded</span>
        </div>
        <h2 style="margin:0.8rem 0 0.3rem">Digital SAT Reading and Writing drill</h2>
        ${status}
        <p>Each set is 6 Words in Context, 3 Text Structure and Purpose, and 1 Cross-Text Connections. Work in one sitting. Do not peek at later files if you want a clean timed set.</p>
        <label class="sans muted" for="dayPick">Choose a day</label><br />
        <select id="dayPick" ${options ? "" : "disabled"}>${options || "<option>No days loaded</option>"}</select>
        <div class="nav">
          <button class="primary" id="startBtn" ${options ? "" : "disabled"}>Start 12-minute set</button>
          <button class="secondary" id="reviewBtn" ${options ? "" : "disabled"}>Review with answers</button>
        </div>
      `;
      document.getElementById("startBtn").onclick = () => startQuiz(false);
      document.getElementById("reviewBtn").onclick = () => startQuiz(true);
      show("home");
    }

    function startQuiz(review) {
      const days = bankDays();
      const n = parseInt(document.getElementById("dayPick").value, 10);
      const pack = days.get(n);
      if (!pack) return;
      clearInterval(state.tick);
      state = {
        day: n,
        idx: 0,
        answers: Array(pack.questions.length).fill(null),
        seconds: MINUTES * 60,
        tick: null,
        review,
        pack
      };
      if (!review) {
        state.tick = setInterval(() => {
          state.seconds -= 1;
          if (state.seconds <= 0) {
            state.seconds = 0;
            finish();
          } else {
            const t = document.getElementById("clock");
            if (t) paintTimer(t);
          }
        }, 1000);
      }
      show("quiz");
      renderQuestion();
    }

    function paintTimer(el) {
      const m = Math.floor(state.seconds / 60);
      const s = String(state.seconds % 60).padStart(2, "0");
      el.textContent = `${m}:${s}`;
      el.className = "timer" + (state.seconds <= 60 ? " hot" : state.seconds <= 180 ? " warn" : "");
    }

    function renderQuestion() {
      const q = state.pack.questions[state.idx];
      const dots = state.pack.questions.map((_, i) => {
        const cls = i === state.idx ? "on" : state.answers[i] ? "done" : "";
        return `<div class="dot ${cls}"></div>`;
      }).join("");
      const texts = q.texts.map((t) => `
        <div class="passage">
          ${t.label ? `<div class="label">${t.label}</div>` : ""}
          <div>${t.body}</div>
        </div>
      `).join("");
      const choices = ["A", "B", "C", "D"].map((L) => {
        const picked = state.answers[state.idx] === L;
        let extra = picked ? " selected" : "";
        if (state.review) {
          if (L === q.answer) extra = " correct";
          else if (picked && L !== q.answer) extra = " wrong";
        }
        return `<button class="choice${extra}" data-l="${L}" ${state.review ? "disabled" : ""}>
          <span class="letter">${L}</span><span>${q.choices[L]}</span>
        </button>`;
      }).join("");

      let explain = "";
      if (state.review) {
        const wrong = ["A", "B", "C", "D"].filter((L) => L !== q.answer).map((L) =>
          `<p><strong>${L}.</strong> ${q.explain.wrong[L]}</p>`
        ).join("");
        explain = `<div class="explain">
          <h3>Answer: ${q.answer}</h3>
          <p>${q.explain.correct}</p>
          ${wrong}
        </div>`;
      }

      quizEl.innerHTML = `
        <div class="row sans">
          <span class="pill">Day ${state.day}</span>
          <span class="pill skill">${q.skill}</span>
          <span class="pill">Question ${state.idx + 1} / ${state.pack.questions.length}</span>
          ${state.review ? '<span class="pill">Review</span>' : '<span id="clock" class="timer"></span>'}
        </div>
        <div class="dots">${dots}</div>
        ${texts}
        <p class="prompt">${q.prompt}</p>
        <div class="choices">${choices}</div>
        ${explain}
        <div class="nav">
          <button class="secondary" id="prevBtn" ${state.idx === 0 ? "disabled" : ""}>Back</button>
          <button class="primary" id="nextBtn">${state.idx === state.pack.questions.length - 1 ? (state.review ? "Finish" : "Submit set") : "Next"}</button>
        </div>
      `;
      if (!state.review) paintTimer(document.getElementById("clock"));
      quizEl.querySelectorAll(".choice").forEach((btn) => {
        btn.onclick = () => {
          state.answers[state.idx] = btn.getAttribute("data-l");
          renderQuestion();
        };
      });
      document.getElementById("prevBtn").onclick = () => { state.idx -= 1; renderQuestion(); };
      document.getElementById("nextBtn").onclick = () => {
        if (state.idx === state.pack.questions.length - 1) finish();
        else { state.idx += 1; renderQuestion(); }
      };
    }

    function finish() {
      clearInterval(state.tick);
      const qs = state.pack.questions;
      let score = 0;
      const bySkill = {};
      qs.forEach((q, i) => {
        const ok = state.answers[i] === q.answer;
        if (ok) score += 1;
        if (!bySkill[q.skill]) bySkill[q.skill] = { right: 0, n: 0 };
        bySkill[q.skill].n += 1;
        if (ok) bySkill[q.skill].right += 1;
      });
      if (!state.review) {
        const stored = loadStore();
        stored[state.day] = { score, answers: state.answers, at: new Date().toISOString() };
        saveStore(stored);
      }
      const skills = Object.entries(bySkill).map(([k, v]) =>
        `<li>${k}: ${v.right}/${v.n}</li>`
      ).join("");
      resultsEl.innerHTML = `
        <div class="row sans"><span class="pill">Day ${state.day}</span><span class="pill">${pretty(ymdFromDay(state.day))}</span></div>
        <p class="muted sans" style="margin-bottom:0">Score</p>
        <div class="score">${score} / ${qs.length}</div>
        <ul>${skills}</ul>
        <p class="muted">Log misses in a notebook by skill. Official Bluebook tests stay separate from this drill.</p>
        <div class="nav">
          <button class="primary" id="seeAns">See explanations</button>
          <button class="secondary" id="homeBtn">Back to start</button>
        </div>
      `;
      document.getElementById("seeAns").onclick = () => {
        state.review = true;
        state.idx = 0;
        show("quiz");
        renderQuestion();
      };
      document.getElementById("homeBtn").onclick = renderHome;
      show("results");
    }

    renderHome();
  </script>
</body>
</html>
