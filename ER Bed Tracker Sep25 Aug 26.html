<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER Bed Tracker Week</title>
    <style>
        :root {
            --color-cream-50: rgba(252, 252, 249, 1);
            --color-cream-100: rgba(255, 255, 253, 1);
            --color-slate-900: rgba(19, 52, 59, 1);
            --color-slate-500: rgba(98, 108, 113, 1);
            --color-teal-500: rgba(33, 128, 141, 1);
            --color-teal-600: rgba(29, 116, 128, 1);
            --color-brown-600-rgb: 94, 82, 64;
            --color-background: var(--color-cream-50);
            --color-surface: var(--color-cream-100);
            --color-text: var(--color-slate-900);
            --color-primary: var(--color-teal-500);
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: var(--color-background); color: var(--color-text); }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 32px; margin-bottom: 30px; }
        .los-config { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; background: var(--color-surface); padding: 20px; border-radius: 8px; border: 1px solid rgba(var(--color-brown-600-rgb), 0.2); }
        label { font-weight: 600; margin-bottom: 8px; font-size: 14px; display:block; }
        input[type="number"], select { padding: 10px; border: 1px solid rgba(var(--color-brown-600-rgb), 0.2); border-radius: 6px; font-size: 14px; background: var(--color-background); color: var(--color-text); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: var(--color-surface); }
        th { background-color: rgba(var(--color-brown-600-rgb), 0.05); padding: 12px; text-align: left; font-weight: 600; border: 1px solid rgba(var(--color-brown-600-rgb), 0.2); }
        td { padding: 10px 12px; border: 1px solid rgba(var(--color-brown-600-rgb), 0.1); }
        .metric-card { background: var(--color-surface); padding: 15px; border-radius: 8px; border: 1px solid rgba(var(--color-brown-600-rgb), 0.2); }
        .metric-value { font-size: 24px; font-weight: 600; color: var(--color-primary); }
        .heat-low { background: #22c55e; color: white; }
        .heat-med { background: #eab308; color: white; }
        .heat-high { background: #f97316; color: white; }
        .heat-critical { background: #ef4444; color: white; }
        .btn { padding: 10px 20px; background: var(--color-primary); color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>ER Bed Tracker Sep25 Aug 26</h1>
        <div class="los-config">
            <label>Admitted LOS (minutes)<input id="admittedLOS" type="number" value="368" min="0"></label>
            <label>Discharge LOS (minutes)<input id="dischargeLOS" type="number" value="262" min="0"></label>
        </div>
        <p>Census uses admits for admitted LOS and discharges for discharge LOS.</p>
        <div id="metrics"></div>
        <canvas id="capacityChart"></canvas>
        <div id="heatmap"></div>
        <table><tbody id="resultsTable"></tbody></table>
    </div>
    <script>
        const state = {
            beds: [30,30,30,30,30,30,30,30,30,42,42,42,42,52,52,52,52,52,52,52,52,42,42,42],
            arrivals: [5,5,4,4,3,3,4,6,7,10,12,12,13,11,11,11,11,11,9,9,9,8,7,6],
            admits: [1,1,1,1,1,1,1,2,2,3,4,4,5,4,4,4,4,4,3,3,3,2,2,2],
            discharges: [4,4,3,3,2,2,3,4,5,7,8,8,8,7,7,7,7,7,6,6,6,6,5,4]
        };
        function stayFraction(lagHours, los) {
            if (los <= 0) return 0;
            const lag = lagHours * 60; let sum = 0;
            for (let u = 0; u < 60; u++) sum += Math.max(0, Math.min(u + los, lag + 60) - Math.max(u, lag));
            return sum / 3600;
        }
        function bedsNeeded(hour, admittedLOS, dischargeLOS) {
            let occupancy = 0;
            for (let arrived = 0; arrived < 24; arrived++) {
                const lag = (hour - arrived + 24) % 24;
                occupancy += state.admits[arrived] * stayFraction(lag, admittedLOS);
                occupancy += state.discharges[arrived] * stayFraction(lag, dischargeLOS);
            }
            return occupancy;
        }
        function calculate() {
            const admittedLOS = parseInt(document.getElementById('admittedLOS').value) || 0;
            const dischargeLOS = parseInt(document.getElementById('dischargeLOS').value) || 0;
            const rows = [];
            for (let h = 0; h < 24; h++) {
                const occupancy = bedsNeeded(h, admittedLOS, dischargeLOS);
                const available = state.beds[h];
                rows.push({hour:h, available, occupancy:Math.round(occupancy), deficit:Math.max(0, Math.round(occupancy-available))});
            }
            document.getElementById('metrics').innerHTML = '<div class="metric-card"><div class="metric-value">'+Math.max(...rows.map(r=>r.deficit))+'</div>Peak bed deficit</div>';
            document.getElementById('resultsTable').innerHTML = rows.map(r=>'<tr><td>'+String(r.hour).padStart(2,'0')+':00</td><td>'+r.available+'</td><td>'+r.occupancy+'</td><td>'+r.deficit+'</td></tr>').join('');
            const heat = document.getElementById('heatmap');
            heat.innerHTML = rows.map(r=>'<div class="'+(r.deficit===0?'heat-low':r.deficit<=5?'heat-med':r.deficit<=10?'heat-high':'heat-critical')+'" style="display:inline-block;margin:4px;padding:10px;border-radius:4px">'+String(r.hour).padStart(2,'0')+'<br>'+r.deficit+'</div>').join('');
            if (window.chart) window.chart.destroy();
            window.chart = new Chart(document.getElementById('capacityChart'), {type:'line', data:{labels:rows.map(r=>String(r.hour).padStart(2,'0')+':00'), datasets:[{label:'Beds needed', data:rows.map(r=>r.occupancy), borderColor:'#ef4444'}, {label:'Beds open', data:rows.map(r=>r.available), borderColor:'#06b6d4'}]}, options:{responsive:true}});
        }
        calculate();
        document.getElementById('admittedLOS').oninput = calculate;
        document.getElementById('dischargeLOS').oninput = calculate;
    </script>
</body>
</html>
