<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ER Bed Tracker Weekday</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>:root{--bg:#1f2121;--s:#262828;--t:#f5f5f5;--p:#21808d;--l:#596066}*{box-sizing:border-box}body{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--t)}.container{max-width:1200px;margin:auto}h1{font-size:32px;margin-bottom:30px}.los,.section,.card,.legend{background:var(--s);border:1px solid var(--l);border-radius:8px}.los{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px;padding:20px}label{font-weight:600;display:block;margin-bottom:8px}input,select{padding:10px;border:1px solid var(--l);border-radius:6px;background:var(--bg);color:var(--t)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.section{padding:15px}table{width:100%;border-collapse:collapse;background:var(--s)}th,td{padding:8px;border:1px solid var(--l);text-align:left}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin:25px 0}.card{padding:15px}.v{font-size:24px;font-weight:600;color:var(--p)}.label{font-size:12px;color:#aeb8ba;margin-top:5px}.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.cell{min-height:72px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;color:#fff}.low{background:#22c55e}.med{background:#eab308}.high{background:#f97316}.critical{background:#ef4444}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;padding:12px}.sw{height:14px;width:28px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}</style></head><body><main class="container"><h1>ER Bed Tracker Weekday</h1><div class="los"><div><label>Admitted LOS (minutes)</label><input id="a" type="number" value="374" min="0"></div><div><label>Discharge LOS (minutes)</label><input id="d" type="number" value="265" min="0"></div></div><div class="grid"><div class="section"><h4>Beds Available by Hour</h4><table><tbody id="bt"></tbody></table></div><div class="section"><h4>Hourly Statistics</h4><table><tbody id="pt"></tbody></table></div></div><div id="met" class="metrics"></div><h3>Capacity Visualization</h3><canvas id="ch"></canvas><h3>Occupancy Heat Map</h3><select id="sel"><option value="x">Bed Deficit/Availability</option><option value="o">Total Occupancy</option><option value="p">Occupancy %</option></select><div class="legend"><span><i class="sw low"></i>No deficit / under 60%</span><span><i class="sw med"></i>Deficit 1–5 / 60–80%</span><span><i class="sw high"></i>Deficit 6–10 / 80–100%</span><span><i class="sw critical"></i>Deficit over 10 / over 100%</span></div><div id="hm" class="heat"></div><h3>Hourly Results</h3><table><thead><tr><th>Hour</th><th>Beds Available</th><th>Occupancy</th><th>Occupancy %</th><th>Bed Deficit</th></tr></thead><tbody id="rt"></tbody></table></main><script>const S={b:[32,32,32,32,32,32,32,32,32,44,44,44,44,54,54,54,54,54,54,54,54,44,44,44],r:[5,4,4,3,3,3,4,6,8,11,12,13,13,12,11,11,11,11,9,10,9,8,7,6],m:[1,1,1,1,1,1,1,2,2,3,4,5,5,4,4,4,4,4,3,3,3,2,2,2],q:[4,3,3,2,2,2,3,4,6,8,8,8,8,8,7,7,7,7,6,7,6,6,5,4]};let C;const z=n=>String(n).padStart(2,'0'),f=(l,L)=>{let x=l*60,t=0;for(let u=0;u<60;u++)t+=Math.max(0,Math.min(u+L,x+60)-Math.max(u,x));return L?t/3600:0},c=r=>sel.value==='x'?(r.x?'med':'low'):(r.p<60?'low':r.p<80?'med':r.p<=100?'high':'critical');function go(){let R=S.b.map((b,h)=>{let o=0;for(let i=0;i<24;i++){let l=(h-i+24)%24;o+=S.m[i]*f(l,+a.value)+S.q[i]*f(l,+d.value)}o=Math.round(o);return{h,b,o,p:Math.round(o/b*100),x:Math.max(0,o-b)}});met.innerHTML=`<div class="card"><div class="v">${Math.max(...R.map(r=>r.x))}</div><div class="label">Peak Bed Deficit</div></div><div class="card"><div class="v">${Math.round(R.reduce((s,r)=>s+r.o,0)/24)}</div><div class="label">Average Occupancy</div></div><div class="card"><div class="v">${Math.max(...R.map(r=>r.p))}%</div><div class="label">Max Occupancy %</div></div>`;rt.innerHTML=R.map(r=>`<tr><td>${z(r.h)}:00</td><td>${r.b}</td><td>${r.o}</td><td>${r.p}%</td><td>${r.x}</td></tr>`).join('');hm.innerHTML=R.map(r=>`<div class="cell ${c(r)}">${z(r.h)}:00<b>${sel.value==='x'?r.x:sel.value==='o'?r.o:r.p}</b></div>`).join('');if(C)C.destroy();C=new Chart(ch,{type:'line',data:{labels:R.map(r=>z(r.h)+':00'),datasets:[{label:'Total Occupancy',data:R.map(r=>r.o),borderColor:'#ef4444'},{label:'Bed Capacity',data:R.map(r=>r.b),borderColor:'#06b6d4'}]}})}function init(){bt.innerHTML=S.b.map((v,h)=>`<tr><td>${z(h)}:00</td><td><input data-k="b" data-h="${h}" value="${v}" type="number"></td></tr>`).join('');pt.innerHTML=S.r.map((v,h)=>`<tr><td>${z(h)}:00</td><td><input data-k="r" data-h="${h}" value="${v}"></td><td><input data-k="m" data-h="${h}" value="${S.m[h]}"></td><td><input data-k="q" data-h="${h}" value="${S.q[h]}"></td></tr>`).join('');document.querySelectorAll('[data-k]').forEach(e=>e.oninput=x=>{S[x.target.dataset.k][x.target.dataset.h]=+x.target.value||0;go()});a.oninput=d.oninput=sel.onchange=go;go()}init()</script></body></html>
